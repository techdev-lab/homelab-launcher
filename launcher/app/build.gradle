plugins {
    id 'com.android.application'
}

// Optional: keep build output (tens of MB) out of a synced folder. Pass -PoutDir=<folder>, or set
// TVHOME_OUT_DIR; without either, Gradle's default app/build is used.
def outDir = project.findProperty('outDir') ?: System.getenv('TVHOME_OUT_DIR')
if (outDir) {
    layout.buildDirectory.set(file(outDir))
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 34
        // Kept at 4 on purpose while 2.3 (C0EF7457…, versionCode 4) is the rollback: going back to a lower
        // versionCode needs `install -d`, which Android allows for debuggable packages only, and ours are not.
        // Raise it once 2.4 has passed on the TV and 2.3 is no longer the way back.
        versionCode 4
        versionName '2.9.0'
    }

    // Releases on GitHub are signed with the project key from the environment (see docs/RELEASING.md); a local build
    // without it keeps the debug key, as before. Same key on both sides lets `adb install -r` move between them.
    signingConfigs {
        project {
            def ks = System.getenv('TVHOME_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('TVHOME_KEYSTORE_PASSWORD') ?: 'android'
                keyAlias System.getenv('TVHOME_KEY_ALIAS') ?: 'androiddebugkey'
                keyPassword System.getenv('TVHOME_KEY_PASSWORD') ?: 'android'
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig System.getenv('TVHOME_KEYSTORE') ? signingConfigs.project : signingConfigs.debug
        }
    }

    // Two builds from one source. offline (the default) has no INTERNET permission and no network code at all;
    // online adds INTERNET (src/online/AndroidManifest.xml) and the real Feeds class for matches and news.
    // Same applicationId, so either one installs over the other with `install -r`.
    buildFeatures {
        buildConfig true
    }
    flavorDimensions 'net'
    productFlavors {
        offline {
            dimension 'net'
            isDefault true
        }
        online {
            dimension 'net'
            versionNameSuffix '-online'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The HomeLab, Serene and Kids wallpaper sets live once in the repository (../../wallpapers) and are copied into the APK's
// assets at build time, so the downloadable APK is complete without pushing pictures to the TV.
def wallpaperAssets = layout.buildDirectory.dir('generated/wallpaperAssets')
tasks.register('syncWallpaperAssets', Sync) {
    from(rootProject.file('../wallpapers')) {
        include 'homelab/*.jpg', 'serene/*.jpg', 'kids/*.jpg'
    }
    into wallpaperAssets.map { it.dir('wallpapers') }
}
android.sourceSets.main.assets.srcDir(wallpaperAssets)
tasks.named('preBuild').configure { dependsOn 'syncWallpaperAssets' }

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.1.0'
    // Test only (never in the APK): plain JVM tests for the pure-Java rules, src/test.
    testImplementation 'junit:junit:4.13.2'
}
