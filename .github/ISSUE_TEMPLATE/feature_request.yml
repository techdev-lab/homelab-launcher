name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The project is a calm, private, Arabic-first home screen. Ideas that need a new permission, an account
        or a paid service are unlikely to fit. See the list of wanted contributions in `CONTRIBUTING.md`.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like to see? For a data source, give the HTTPS address and the terms of use.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
