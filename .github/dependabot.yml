version: 2
updates:
  - package-ecosystem: gradle
    directory: /launcher
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    # Gradle 9, Android Gradle Plugin 9 and compileSdk 35 (which recyclerview 1.4 needs) are one coupled
    # toolchain upgrade. Plan and test it on a TV as a single change instead of taking the bumps one by one.
    ignore:
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      - dependency-name: "androidx.recyclerview:recyclerview"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
